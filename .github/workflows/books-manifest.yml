name: Update books.json and covers
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:       # or run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: books-manifest
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pymupdf
      - run: python3 generate_books.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A books.json covers
          git diff --cached --quiet || (git commit -m "Update books.json and covers" && git push)
